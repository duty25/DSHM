name: Build SiliconLeap APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "@deepseek-ai/dsh 版本（默认 0.1.5-rc.2，已适配；想回到原版行为填 0.1.0-rc.6）"
        required: false
        default: "0.1.5-rc.2"

concurrency:
  group: build-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-subsystem-assets:
    name: Build subsystem assets (Debian + Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Debian subsystem assets
        env:
          # 必须显式传：脚本读的是 GITHUB_REPO，不是 Actions 自动注入的 GITHUB_REPOSITORY
          GITHUB_REPO: ${{ github.repository }}
          TERMUX_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main
          SUBSYS_FLAVOR: debian
          SUBSYS_TAG: debian-subsystem
        run: |
          chmod +x runtime-builder/build_subsystem.sh
          WORK="$RUNNER_TEMP/ss-debian" OUT="$GITHUB_WORKSPACE/ss-out/debian" ./runtime-builder/build_subsystem.sh
          ls -lh ss-out/debian/

      - name: Build Ubuntu subsystem assets
        env:
          # 必须显式传：脚本读的是 GITHUB_REPO，不是 Actions 自动注入的 GITHUB_REPOSITORY
          GITHUB_REPO: ${{ github.repository }}
          TERMUX_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main
          SUBSYS_FLAVOR: ubuntu
          SUBSYS_TAG: ubuntu-subsystem
        run: |
          chmod +x runtime-builder/build_subsystem.sh
          WORK="$RUNNER_TEMP/ss-ubuntu" OUT="$GITHUB_WORKSPACE/ss-out/ubuntu" ./runtime-builder/build_subsystem.sh
          ls -lh ss-out/ubuntu/

      - name: Publish subsystem assets (debian-subsystem release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="debian-subsystem"
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ss-out/debian/proot-aarch64.tar.gz ss-out/debian/debian-minbase-aarch64.tar.gz ss-out/debian/metadata.json --clobber --repo "${REPO}"
          else
            gh release create "${TAG}" ss-out/debian/proot-aarch64.tar.gz ss-out/debian/debian-minbase-aarch64.tar.gz ss-out/debian/metadata.json \
              --title "Debian Subsystem Assets" \
              --notes "应用在线下载的 Debian 子系统（proot + rootfs，自动更新覆盖上传）" \
              --repo "${REPO}"
          fi

      - name: Publish subsystem assets (ubuntu-subsystem release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TAG="ubuntu-subsystem"
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ss-out/ubuntu/proot-aarch64.tar.gz ss-out/ubuntu/ubuntu-minbase-aarch64.tar.gz ss-out/ubuntu/metadata.json --clobber --repo "${REPO}"
          else
            gh release create "${TAG}" ss-out/ubuntu/proot-aarch64.tar.gz ss-out/ubuntu/ubuntu-minbase-aarch64.tar.gz ss-out/ubuntu/metadata.json \
              --title "Ubuntu Subsystem Assets" \
              --notes "应用在线下载的 Ubuntu 子系统（proot + rootfs，自动更新覆盖上传）" \
              --repo "${REPO}"
          fi

  build-and-release:
    name: Build runtime + APK + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 手动触发时用输入框里的版本；打 tag 时回落到默认
      DSH_VERSION: ${{ github.event.inputs.dsh_version || '0.1.5-rc.2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 自动打补丁：这样你只需要替换这一个文件 ──────────────────────────────
      #   1) 端口 3080 -> 3082：避开和 DSH App（也占 127.0.0.1:3080）的冲突
      #   2) 下载源从作者仓库改成你自己的 fork（从 GITHUB_REPOSITORY 自动推导，
      #      所以你 fork 改名叫什么都行）
      - name: 自动打补丁（端口 + 下载源指向本 fork）
        run: |
          set -euo pipefail
          R="${GITHUB_REPOSITORY}"
          D=android/app/src/main/java/com/siliconleap/app/runtime
          echo "fork = $R"
          sed -i 's|val port: Int = 3080|val port: Int = 3082|' "$D/RuntimeManager.kt"
          sed -i "s|RochelimitDawn/DSHM|${R}|g; s|你的GitHub用户名/DSHM|${R}|g" \
            "$D/RuntimeManager.kt" "$D/SourceManager.kt" "$D/SubsystemManager.kt"
          echo "--- 校验：应该看到 3082 和你的 fork 名字 ---"
          grep -n "val port: Int" "$D/RuntimeManager.kt"
          grep -rn "releases/download" "$D" | grep -v AddonManager
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip dpkg dpkg-dev

      # ── 「打开 Harness」按钮要带上启动 token ────────────────────────────────
      #   dsh <= 0.1.0-rc.6 的网页没有鉴权；0.1.1 起加了启动 token 校验，直接开
      #   http://127.0.0.1:3082/ 会看到 "dsh web authentication required"。
      #   做法：RuntimeManager 在读取 harness 输出的当下，就把 dsh 打印的那行带
      #   token 网址抓下来存内存（DSHM 的日志是「内存环形缓冲 + 攒够 32 行才落盘」，
      #   事后读文件或读日志都可能拿不到）；「打开 Harness」优先用它，另有内存日志、
      #   日志文件两级兜底。找不到源码就报错，不静默放过。
      - name: 让「打开 Harness」带上启动 token
        run: |
          node - <<'NODEEOF'
          const fs = require('fs')

          // 这个补丁改两个文件：
          //   1) RuntimeManager.kt —— 读到 harness 输出的当下就把带 token 的网址存下来
          //                          （内存 + 一个随服务启动重置的小文件），并提供提取函数
          //   2) HomeScreen.kt     —— 「打开 Harness」按可靠性依次取用
          //
          // 为什么这么做：DSHM 的 LogStore 是「内存环形缓冲(600 行) + 攒够 32 行才落盘」。
          // 更麻烦的是：App 被后台划掉再打开时，如果旧的 harness 进程还活着，App 会直接
          // 复用它、不会重启服务 —— 这时内存缓冲是空的、磁盘上可能只有很旧的网址。
          // 所以在"读到那一行"的当下就存下来最可靠。

          const RM = 'android/app/src/main/java/com/siliconleap/app/runtime/RuntimeManager.kt'
          const HS = 'android/app/src/main/java/com/siliconleap/app/ui/screens/HomeScreen.kt'

          function patchFile(file, marker, oldText, newText, okMsg) {
            if (!fs.existsSync(file)) {
              console.log('::error::找不到 ' + file + '（token 补丁没打上）')
              process.exit(1)
            }
            const src = fs.readFileSync(file, 'utf8')
            if (src.includes(marker)) {
              console.log(file.split('/').pop() + ': 已打过，跳过')
              return
            }
            if (!src.includes(oldText)) {
              console.log('::error::' + file + ' 里没找到要替换的原始源码 —— token 补丁没打上')
              process.exit(1)
            }
            fs.writeFileSync(file, src.replace(oldText, newText))
            console.log(okMsg)
          }

          const ANSI_RE = String.raw`Regex("\\u001B\\[[0-9;]*[A-Za-z]")`
          const TOKEN_URL_RE = String.raw`Regex("http://\\S*?\\?token=[A-Za-z0-9_\\-]+={0,2}")`
          const DSH_WEB_RE = String.raw`Regex("dsh web:\\s*(http://\\S+)")`

          // ── 1a) RuntimeManager.kt：提取函数（先剥 ANSI 颜色码，再按两种形态找）────────
          patchFile(
            RM,
            'fun extractHarnessUrl',
            '    fun tailLog(lines: Int = 80): String {',
            [
              '    /** DSHM: 从任意日志文本里提取 dsh 打印的带 token 网址（没有就返回 null）。 */',
              '    fun extractHarnessUrl(text: String): String? {',
              '        // 保险：万一输出里带 ANSI 颜色码，先剥掉再匹配',
              `        val clean = text.replace(${ANSI_RE}, "")`,
              '        // 首选：直接找带 token 的网址（不依赖前缀文案）',
              `        ${TOKEN_URL_RE}.find(clean)?.let { return it.value }`,
              '        // 退而求其次：dsh 打印的那一行',
              `        ${DSH_WEB_RE}.find(clean)?.let { return it.groupValues[1] }`,
              '        return null',
              '    }',
              '',
              '    /** DSHM: dsh 启动时打印的带 token 网址（内存 + 小文件，随服务启动一起重置）。 */',
              '    @Volatile',
              '    private var capturedHarnessUrl: String? = null',
              '',
              '    /** DSHM: 供「打开 Harness」取用；还没捕获到就返回 null。 */',
              '    fun harnessUrl(): String? = capturedHarnessUrl ?: runCatching {',
              '        val f = File(TermuxEnv.logs(appContext), "harness-url.txt")',
              '        if (!f.exists()) return@runCatching null',
              '        val text = f.readText().trim()',
              '        if (text.isEmpty()) null else text',
              '    }.getOrNull()',
              '',
              '    fun tailLog(lines: Int = 80): String {',
            ].join('\n'),
            'RuntimeManager.kt: 已加入 extractHarnessUrl() / harnessUrl()'
          )

          // ── 1b) RuntimeManager.kt：读到那一行时立刻捕获（内存 + 小文件）──────────────
          patchFile(
            RM,
            'capturedHarnessUrl',
            '                for (line in reader.lineSequence()) {\n' +
              '                    log.append(line)\n' +
              '                }',
            [
              '                for (line in reader.lineSequence()) {',
              '                    log.append(line)',
              '                    // DSHM: 读到 dsh 打印的带 token 网址就立刻存下来（内存 + 小文件），',
              '                    // 不依赖日志落盘时机、也不怕日志环形缓冲把它挤掉。',
              '                    runCatching {',
              '                        extractHarnessUrl(line)?.let {',
              '                            capturedHarnessUrl = it',
              '                            runCatching {',
              '                                File(TermuxEnv.logs(appContext), "harness-url.txt").writeText(it)',
              '                            }',
              '                        }',
              '                    }',
              '                }',
            ].join('\n'),
            'RuntimeManager.kt: 已在读取 harness 输出时捕获带 token 的网址'
          )

          // ── 1c) RuntimeManager.kt：每次启动服务时把捕获的网址一起清掉 ────────────────
          patchFile(
            RM,
            'capturedHarnessUrl = null',
            '    private fun clearLog() {\n' +
              '        LogStore.named(TermuxEnv.serverLog(appContext)).clear()',
            [
              '    private fun clearLog() {',
              '        LogStore.named(TermuxEnv.serverLog(appContext)).clear()',
              '        // DSHM: 换一个 harness 进程就换一个 token，所以启动时把上次捕获的网址清掉，',
              '        // 免得「打开 Harness」拿到旧 token 又变成 401。',
              '        capturedHarnessUrl = null',
              '        runCatching { File(TermuxEnv.logs(appContext), "harness-url.txt").delete() }',
            ].join('\n'),
            'RuntimeManager.kt: 启动服务时清掉上次捕获的网址'
          )

          // ── 2) HomeScreen.kt：打开时按可靠性依次取网址 ──────────────────────────────
          const OLD =
            'private fun openHarness(context: Context, port: Int) {\n' +
            '    val intent = Intent(Intent.ACTION_VIEW, Uri.parse("http://127.0.0.1:$port/"))'
          const NEW = [
            'private fun openHarness(context: Context, port: Int) {',
            '    // dsh >= 0.1.1 的网页加了启动 token 鉴权：裸地址会返回 401',
            '    // "dsh web authentication required"。按可靠性依次取 dsh 打印的那行网址：',
            '    //   1) RuntimeManager 在读到 harness 输出时抓下来的（内存 / 随服务启动的小文件）',
            '    //   2) 内存日志缓冲里的（界面「查看运行日志」看的就是它）',
            '    //   3) 日志文件开头 8KB（进程重启后内存为空时的兜底）',
            '    var printedUrl = RuntimeManager.harnessUrl()',
            '    if (printedUrl == null) {',
            '        printedUrl = RuntimeManager.extractHarnessUrl(RuntimeManager.tailLog(600))',
            '    }',
            '    if (printedUrl == null) {',
            '        printedUrl = runCatching {',
            '            val log = com.siliconleap.app.runtime.TermuxEnv.serverLog(context)',
            '            if (!log.exists()) return@runCatching null',
            '            val raf = java.io.RandomAccessFile(log, "r")',
            '            try {',
            '                val n = minOf(raf.length(), 8192L).toInt()',
            '                val buf = ByteArray(n)',
            '                raf.readFully(buf)',
            '                RuntimeManager.extractHarnessUrl(String(buf, Charsets.UTF_8))',
            '            } finally {',
            '                raf.close()',
            '            }',
            '        }.getOrNull()',
            '    }',
            '    if (printedUrl == null) {',
            '        android.widget.Toast.makeText(',
            '            context,',
            '            "没找到 dsh 打印的网址，用默认地址打开（可能仍会要求鉴权）",',
            '            android.widget.Toast.LENGTH_LONG,',
            '        ).show()',
            '    }',
            '    val url = printedUrl ?: "http://127.0.0.1:$port/"',
            '    val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url))',
          ].join('\n')

          patchFile(HS, 'RuntimeManager.harnessUrl()', OLD, NEW, 'HomeScreen.kt: 「打开 Harness」优先使用带 token 的网址')
          NODEEOF

      # ── 让容器里也能看到手机共享存储（原路径）──────────────────────────────
      #   和 Termux 版对齐：把 /storage/emulated/0 以【同一个绝对路径】bind 进 proot，
      #   这样容器里用的就是 /storage/emulated/0/DSHM/... 这种宿主路径。
      #   要真正读写，手机上还需在「设置 → 工作区与权限 → 文件访问权限」授予
      #   「所有文件访问」；没授权也能用，只是那个目录读不了内容。
      - name: 让容器能看到共享存储（原路径 bind）
        run: |
          node - <<'NODEEOF2'
          const fs = require('fs')

          const file = 'android/app/src/main/java/com/siliconleap/app/runtime/TermuxEnv.kt'
          const MARK = 'DSHM: 共享存储原路径 bind'
          const OLD =
            '        argv += "-b"; argv += "${tmp(context).absolutePath}:/tmp"\n' +
            '        argv += "/bin/bash"'
          const NEW = [
            '        // DSHM: 共享存储原路径 bind —— 让容器里也能用 /storage/emulated/0/... 这种',
            '        // 和宿主完全一样的路径（Termux 版就是这个行为）。注意：要真正读写，',
            '        // 需要在「设置 → 工作区与权限 → 文件访问权限」里授予「所有文件访问」，',
            '        // 否则路径可见但内容会 EACCES。',
            '        val sharedStorage = File("/storage/emulated/0")',
            '        if (sharedStorage.isDirectory) {',
            '            argv += "-b"; argv += "${sharedStorage.absolutePath}:${sharedStorage.absolutePath}"',
            '        }',
            '        argv += "-b"; argv += "${tmp(context).absolutePath}:/tmp"',
            '        argv += "/bin/bash"',
          ].join('\n')

          if (!fs.existsSync(file)) {
            console.log('::error::找不到 ' + file + '（共享存储 bind 补丁没打上）')
            process.exit(1)
          }
          const src = fs.readFileSync(file, 'utf8')
          if (src.includes(MARK)) {
            console.log('TermuxEnv.kt: 共享存储 bind 补丁已存在，跳过')
            process.exit(0)
          }
          if (!src.includes(OLD)) {
            console.log('::error::TermuxEnv.kt 里没找到 proot argv 的收尾两行 —— 共享存储 bind 补丁没打上')
            process.exit(1)
          }
          fs.writeFileSync(file, src.replace(OLD, NEW))
          console.log('TermuxEnv.kt: 已把 /storage/emulated/0 以原路径 bind 进容器')
          NODEEOF2

      # ── 给新版 dsh 补上原补丁没覆盖的地方 ─────────────────────────────────────
      #   runtime-builder/patch_runtime.js 是按 dsh 0.1.0-rc.6 写的；0.1.1 起有 4 处对不上
      #   （tool-fs-search 的 rg 路径、apiproxy 包被删、session-persistence 的 import、
      #     attachment-local 的 import 被改坏）。这里把针对新形态的补丁【追加】到该文件末尾：
      #   老版本匹配不到只会 [warn] 跳过，无害；有没有生效由下一步做正向校验。
      - name: 适配新版 dsh 的运行时补丁
        run: |
          cat >> runtime-builder/patch_runtime.js <<'JSEOF'

          // ═══════════════════════════════════════════════════════════════════════════
          // 追加补丁：适配 dsh >= 0.1.1（上面的补丁是按 0.1.0-rc.6 写的）
          // 老版本匹配不到时只会打印 [warn] 跳过，不影响结果 —— 是否"该打的全打上了"，
          // 由后面的「校验 Android 补丁」步骤做【正向检查】（查文件里的补丁标志 + 语法）。
          // ═══════════════════════════════════════════════════════════════════════════
          const __dshPkg = path.join(prefix, 'lib/node_modules/@deepseek-ai/dsh/package.json');
          const __dshVer = fs.existsSync(__dshPkg)
            ? JSON.parse(fs.readFileSync(__dshPkg, 'utf8')).version || 'unknown'
            : 'unknown';
          console.log(`[info] 目标 dsh 版本: ${__dshVer}`);

          // Patch 15: dsh >= 0.1.1 的 tool-fs-search 把 ripgrep 路径解析改成了
          //   「先找 ${execPath}-rg 旁挂文件 → 再回退 @vscode/ripgrep」
          // 没有给 DSH_RG_PATH 留任何口子。Android 上 libnode.so 旁边不存在 -rg 旁挂文件、
          // @vscode/ripgrep 也没有 aarch64-android 平台包 → 文件搜索一调用就失败。
          // 在解析函数最前面插入 DSH_RG_PATH 优先分支（两种代码形态都兼容；已打过则跳过）。
          patchFile(
            'lib/node_modules/@deepseek-ai/dsh-tool-fs-search/lib/index.js',
            (src) => {
              if (src.includes('process.env.DSH_RG_PATH')) return src;
              const anchored = src.replace(
                /(rgPathPromise \?\?= Promise\.resolve\(\)\.then\(async \(\) => \{\n)/,
                '$1\t\tif (process.env.DSH_RG_PATH) return process.env.DSH_RG_PATH;\n',
              );
              if (anchored !== src) return anchored;
              return src.replace(
                /return \(await import\("@vscode\/ripgrep"\)\)\.rgPath;/,
                'if (process.env.DSH_RG_PATH) return process.env.DSH_RG_PATH;\n\t\treturn (await import("@vscode/ripgrep")).rgPath;',
              );
            },
            'tool-fs-search DSH_RG_PATH（新版 resolveRgPath）',
          );

          // Patch 16: dsh >= 0.1.2 删掉了 dsh-host-apiproxy，"打开配置文件"的实现搬到了
          // dsh-native-command（报错原文一字未变）。Android 上同样没有 native path opener，
          // 这里给出中文提示并带上路径（原补丁 4 只对老版本有效，匹配不到就跳过）。
          patchFile(
            'lib/node_modules/@deepseek-ai/dsh-native-command/lib/index.js',
            (src) => {
              if (src.includes('Android 沙箱限制')) return src;
              return src.replace(
                /throw new Error\(`native path opener is unsupported on \$\{platform\}`\);/,
                `if (platform === "android") {
                throw new Error("Android 沙箱限制，无法调用系统应用打开该文件；路径：" + path + "。请在 DSHM 应用内或使用 adb 查看。");
              }
              throw new Error(\`native path opener is unsupported on \${platform}\`);`,
              );
            },
            'native-command Android opener 中文提示',
          );

          // Patch 17: attachment-local —— 两件事一起修：
          //   a) dsh >= 0.1.1 的 node:fs/promises import 里本来就有 rename，补丁 6 的
          //      `import { chmod, link, mkdir,` 替换会造出「重复导入 rename」→ ESM 语法错误
          //      （Identifier 'rename' has already been declared），整个模块加载失败。
          //      这里把 import 规范化（去重 + 保证有 copyFile）。
          //   b) 该文件用 link() 发布内容寻址对象，Android SELinux 对 app_data_file 禁 link()
          //      → EACCES。补丁 6 想改成 rename()，但那会「吃掉」源文件：之后紧跟的
          //      unlink(staged.path)/unlink(temporary) 会 ENOENT，附件写入直接失败
          //      （0.1.0-rc.6 上就已是这个问题）。改成排他复制 copyFile(..., 1)：
          //      源文件保留、目标已存在仍返回 EEXIST（保持原代码的竞态分支语义）。
          patchFile(
            'lib/node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js',
            (src) => {
              const replaced = src.replace(
                /await (?:link|rename)\(([^)]*), target\);/g,
                (_m, args) => `await copyFile(${args}, target, 1);`,
              );
              if (replaced === src) return src;
              return replaced.replace(/import \{([^}]*)\} from "node:fs\/promises";/, (_m, names) => {
                const uniq = [...new Set(names.split(',').map((s) => s.trim()).filter(Boolean))];
                if (!uniq.includes('copyFile')) uniq.push('copyFile');
                return `import { ${uniq.join(', ')} } from "node:fs/promises";`;
              });
            },
            'attachment-local 修 import 重复 + link()→排他复制',
          );

          // Patch 18: dsh-session-persistence-jsonl —— 0.1.1 起 import 里多了一个 lstat，
          // 补丁 5 的 `import { link, mkdir,` 匹配不到 → 调用点被改成了 rename() 但 rename
          // 没有导入 → 保存会话时 ReferenceError: rename is not defined。
          // 这里把 rename 补进 import（调用点没改成 rename 的版本直接跳过）。
          patchFile(
            'lib/node_modules/@deepseek-ai/dsh-session-persistence-jsonl/lib/index.js',
            (src) => {
              if (!src.includes('await rename(tmp, finalPath);')) return src;
              return src.replace(/import \{([^}]*)\} from "node:fs\/promises";/, (m, names) => {
                const uniq = [...new Set(names.split(',').map((s) => s.trim()).filter(Boolean))];
                if (uniq.includes('rename')) return m;
                uniq.unshift('rename');
                return `import { ${uniq.join(', ')} } from "node:fs/promises";`;
              });
            },
            'session-persistence 补 rename 导入',
          );

          // Patch 19: koffi stub 加强 —— 0.1.1 起 struct 名字加了前缀（DSH_STARTUPINFOW /
          // DSH_PROCESS_INFORMATION），老 stub 只认不带前缀的名字，其它调用返回 null，
          // 而 dsh-win32-process 会立刻读 `.size` 做 ABI 断言 → TypeError: Cannot read
          // properties of null (reading 'size')，dsh-sandbox-local / dsh-subprocess-local
          // 整个模块加载失败。这里改成"名字无关"的 stub：按关键字给 size，其它一律返回
          // 一个 .size 不抛错的对象，永不返回 null。
          const KOFFI_CORE = `function __siliconleapKoffiStub() {
            const proxy = new Proxy(function () {}, {
              get: (_t, prop) => {
                if (prop === "then") return undefined;
                if (prop === "size") return 104;
                return proxy;
              },
              apply: (_t, _thisArg, args) => {
                const name = typeof args[0] === "string" ? args[0] : "";
                if (name.includes("STARTUPINFO")) return { size: 104 };
                if (name.includes("PROCESS_INFORMATION")) return { size: 24 };
                return proxy;
              },
              construct: () => ({}),
            });
            return proxy;
          }
          `;
          writeFile('lib/node_modules/koffi/index.js', KOFFI_CORE + 'export default __siliconleapKoffiStub();\n', 'koffi index.js stub（加强版）');
          writeFile('lib/node_modules/koffi/index.cjs', KOFFI_CORE + 'module.exports = __siliconleapKoffiStub();\n', 'koffi index.cjs stub（加强版）');

          // Patch 20: node-addon-system 的 flock 在 Android 上直接抛
          //   "flock is not supported on android-arm64"（ERR_FLOCK_UNSUPPORTED_PLATFORM）。
          // dsh >= 0.1.1 的 session-persistence 用 flock 给会话目录加"跨进程写锁"(lease)，
          // 这个抛错会冒到外层 → 保存会话失败 → 整轮对话失败。
          // （0.1.0-rc.6 完全没有 flock —— 又是升级带出来的新问题。）
          // 上游对 browser worker 的做法就是"让 flock 立即成功"：单进程里，进程内的写占用
          // 已经排除了其它写者。DSHM 的运行时同样是单进程，这里照做。
          patchFile(
            'lib/node_modules/@deepseek-ai/node-addon-system/lib/flock.js',
            (src) => {
              if (src.includes('DSHM: Android')) return src;
              return src.replace(
                /export async function tryLockExclusive\(fd\) \{\n/,
                "export async function tryLockExclusive(fd) {\n" +
                  "    // DSHM: Android 上 Node 是 bionic 原生运行，没有 node-addon-system 的\n" +
                  "    // 原生 flock，也没有对应平台包。按上游 browser worker 的做法让它立即成功。\n" +
                  "    if (process.platform === 'android') return;\n",
              );
            },
            'node-addon-system flock 在 Android 上降级为立即成功',
          );

          // Patch 21: sharp 没有 Android 预编译包（官方只发 darwin / linux / linuxmusl /
          // win32 / wasm32），bionic 上的 Node 加载 sharp 会抛
          //   Could not load the "sharp" module using the android-arm64 runtime
          // → dsh-attachment-local 整个模块加载失败。这里把 sharp 的入口换成"调用时才报错"
          // 的桩（和上面 koffi 桩同一个思路）：模块能正常加载，只有真正做图片处理时才抛错，
          // 而 probeImage 已经把它转成 INVALID_IMAGE 这类干净错误。
          const SHARP_STUB = `/* DSHM: Android 上没有 sharp 预编译包，这里用桩让模块能加载。 */
          function __dshmSharpUnavailable() {
            throw new Error('[DSHM] Android 上不支持图片处理（sharp 无 android 预编译包）');
          }
          function __dshmSharpStub() {
            return __dshmSharpUnavailable();
          }
          __dshmSharpStub.cache = __dshmSharpUnavailable;
          __dshmSharpStub.concurrency = __dshmSharpUnavailable;
          __dshmSharpStub.simd = __dshmSharpUnavailable;
          __dshmSharpStub.versions = { sharp: 'stub' };
          `;
          writeFile('lib/node_modules/sharp/dist/index.mjs', SHARP_STUB + 'export default __dshmSharpStub;\n', 'sharp ESM 桩（Android 无 sharp）');
          writeFile('lib/node_modules/sharp/dist/index.cjs', SHARP_STUB + 'module.exports = __dshmSharpStub;\n', 'sharp CJS 桩（Android 无 sharp）');
          JSEOF
          echo "--- patch_runtime.js 共 $(wc -l < runtime-builder/patch_runtime.js) 行 ---"

      - name: Build Termux runtime
        env:
          TERMUX_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main
          NPM_REGISTRY: https://registry.npmmirror.com
          NODE_MIRROR: https://mirrors.ustc.edu.cn/node
        run: |
          set -o pipefail
          echo "装配 dsh 版本 = $DSH_VERSION"
          chmod +x runtime-builder/build_runtime.sh runtime-builder/build_node_pty.sh runtime-builder/launcher/run-dsh.sh
          WORK="$RUNNER_TEMP/sl-runtime" OUT="$GITHUB_WORKSPACE/runtime-out" ./runtime-builder/build_runtime.sh 2>&1 | tee /tmp/rt.log
          ls -lh runtime-out/
          # 补丁到底有没有打上，由下一步「校验 Android 补丁」做【正向检查】
          # （直接查文件里有没有补丁标志 + ESM 语法检查）。
          # 早先版本是 grep 日志里的 [warn]，但那会把 deps/collect_libs 的无害警告
          # 也当成失败（例如「可执行文件不存在: .../bin/curl」），反而误报。

      - name: 校验 Android 补丁
        run: |
          set -euo pipefail
          PFX="${PFX:-$RUNNER_TEMP/sl-runtime/prefix/usr}"
          NM="$PFX/lib/node_modules"
          echo "校验目录：$NM"
          fail=0

          check() { # <相对路径> <必须出现的字面量> <说明>
            local f="$NM/$1"
            if [ ! -f "$f" ]; then
              echo "::error::补丁校验失败：文件不存在 $1 —— 这个 dsh 版本里该包被删/改名了（$3）"
              fail=1
              return
            fi
            if ! grep -qF -- "$2" "$f"; then
              echo "::error::补丁校验失败：$3 没打上 —— $1 里找不到 \"$2\""
              fail=1
            fi
          }

          absent() { # <相对路径> <不该出现的字面量> <说明>
            local f="$NM/$1"
            [ -f "$f" ] || return 0
            if grep -qF -- "$2" "$f"; then
              echo "::error::补丁校验失败：$3 —— $1 里仍存在 \"$2\""
              fail=1
            fi
          }

          syntax() { # <相对路径> —— 语法检查（能抓到"重复导入"这类致命问题）
            # 两种方式都试：不同 Node 版本判定 ESM 的方式不一样（文件参数依赖 package.json
            # 的 type 字段，stdin 形式靠 --input-type=module 强制）。只要一种通过就不算错，
            # 避免因 Node 版本差异误报。
            local f="$NM/$1"
            [ -f "$f" ] || return 0
            if node --check "$f" >/tmp/syntax.err 2>&1; then return 0; fi
            if node --input-type=module --check < "$f" >/tmp/syntax.err 2>&1; then return 0; fi
            echo "::error::语法检查失败：$1（这个文件加载会直接抛错）"
            head -4 /tmp/syntax.err
            fail=1
          }

          # ── 补丁标志（正向检查：文件里有没有补丁留下的痕迹）────────────────────────
          check '@deepseek-ai/dsh-subprocess-local/lib/index.js'          '_siliconleapNodePty'      'node-pty 懒加载降级'
          check '@deepseek-ai/dsh-tool-fs-search/lib/index.js'            'DSH_RG_PATH'              '文件搜索改用 Termux 自带 rg'
          check '@deepseek-ai/dsh-bash-local/lib/index.js'                'DSH_BASH_PATH'            'bash 指向 nativeLibraryDir'
          check '@deepseek-ai/dsh-bash-local/lib/index.js'                'DSH_SUBSYSTEM_ARGV'       'bash 走 proot 子系统'
          check '@deepseek-ai/dsh-bash-local/lib/index.js'                'DSH_SUBSYSTEM_ENV'        'proot glue 的 TMPDIR'
          check '@deepseek-ai/dsh-bash-local/lib/index.js'                'DSH_ROOT_ARGV'            'root 分区 su 包裹'
          check '@deepseek-ai/dsh-bash-sandbox/lib/index.js'              'DSH_BASH_PATH'            'sandbox bash 指向 nativeLibraryDir'
          check '@deepseek-ai/dsh-bash-sandbox/lib/index.js'              'DSH_SUBSYSTEM_ARGV'       'sandbox bash 走 proot 子系统'
          check '@deepseek-ai/dsh-bash-sandbox/lib/index.js'              'DSH_ROOT_ARGV'            'sandbox root 分区 su 包裹'
          check '@deepseek-ai/dsh-terminal-bash/lib/index.js'             'DSH_SUBSYSTEM_ARGV'       '终端 bash 走 proot 子系统'
          check '@deepseek-ai/dsh-sandbox-local/lib/index.js'             'runner: "none"'           'Android 无沙箱降级'
          check '@deepseek-ai/dsh-sandbox-local/lib/index.js'             'selected.runner === "none"' 'confine() 的 none 分支'
          check '@deepseek-ai/dsh-session-persistence-jsonl/lib/index.js' 'rename(tmp, finalPath)'   '会话保存绕开 SELinux link 禁令'
          check '@deepseek-ai/dsh-session-persistence-jsonl/lib/index.js' 'import { rename,'         'rename 有导入（0.1.1 起 import 变了）'
          check '@deepseek-ai/dsh-attachment-local/lib/index.js'          'await copyFile('          '附件发布改成排他复制'
          check '@deepseek-ai/dsh-fs-local/lib/index.js'                  'COPYFILE_EXCL=1'          '原子写文件绕开 link()'
          check '@deepseek-ai/dsh-fs-local/lib/index.js'                  'copyFile, lstat,'         'copyFile 有导入'

          # 不该再出现的（Android 上必然 EACCES / 必崩）
          absent '@deepseek-ai/dsh-attachment-local/lib/index.js' 'await link('   '附件发布仍在用 link()（Android SELinux 会 EACCES）'
          absent '@deepseek-ai/dsh-fs-local/lib/index.js'         'await linkFile(' 'fs-local 仍在用 linkFile()'

          # dsh plugin 装配走 node 直接跑 pnpm（文件名带 hash，扫目录）
          if ! grep -lqF 'PNPM_CJS' "$NM"/@deepseek-ai/dsh/lib/plugin-*.js 2>/dev/null; then
            echo "::error::补丁校验失败：dsh plugin 的 pnpm 调用没改（WebUI 插件装配会失败）"
            fail=1
          fi

          # koffi stub（dsh-win32-process 顶层会读 .size 做 ABI 断言；名字带不带前缀都要能应付）
          for f in "$NM/koffi/index.js" "$NM/koffi/index.cjs"; do
            [ -f "$f" ] || { echo "::error::补丁校验失败：缺少 $f（koffi stub）"; fail=1; continue; }
            grep -qF 'name.includes("STARTUPINFO")' "$f" || {
              echo "::error::补丁校验失败：$f 是旧的 koffi stub（只认不带前缀的 struct 名字），新版 dsh 会 TypeError"
              fail=1
            }
          done

          # flock：只有这个版本确实带了「非 linux/darwin 就抛错」的平台门时才需要这条补丁
          # （0.1.0-rc.6 根本没有 flock；万一以后又去掉，也不该因此判失败）
          FLOCK="$NM/@deepseek-ai/node-addon-system/lib/flock.js"
          if [ -f "$FLOCK" ] && grep -qF 'ERR_FLOCK_UNSUPPORTED_PLATFORM' "$FLOCK"; then
            check '@deepseek-ai/node-addon-system/lib/flock.js' "process.platform === 'android'" 'flock 在 Android 上降级为立即成功'
          else
            echo "· 该版本的 flock 没有平台门（或没有 flock.js），不需要这条补丁"
          fi

          # sharp：Android 没有官方预编译包，必须换成桩，否则 attachment-local 整个模块加载失败
          if [ -f "$NM/sharp/package.json" ]; then
            check 'sharp/dist/index.mjs' '__dshmSharpStub' 'sharp 桩（Android 无 sharp 预编译包）'
            check 'sharp/dist/index.cjs' '__dshmSharpStub' 'sharp 桩（CJS 入口）'
          fi

          # ── 语法检查（ESM 模式；重复导入/括号错位这类问题只有这里能抓到）─────────
          for f in \
            '@deepseek-ai/dsh-subprocess-local/lib/index.js' \
            '@deepseek-ai/dsh-tool-fs-search/lib/index.js' \
            '@deepseek-ai/dsh-bash-local/lib/index.js' \
            '@deepseek-ai/dsh-bash-sandbox/lib/index.js' \
            '@deepseek-ai/dsh-sandbox-local/lib/index.js' \
            '@deepseek-ai/dsh-terminal-bash/lib/index.js' \
            '@deepseek-ai/dsh-fs-local/lib/index.js' \
            '@deepseek-ai/dsh-session-persistence-jsonl/lib/index.js' \
            '@deepseek-ai/dsh-attachment-local/lib/index.js' ; do
            syntax "$f"
          done
          for f in "$NM"/@deepseek-ai/dsh/lib/plugin-*.js; do
            [ -f "$f" ] || continue
            node --input-type=module --check < "$f" >/dev/null 2>&1 || { echo "::error::语法检查失败：$f"; fail=1; }
          done

          # ── 只提示、不算失败的 ────────────────────────────────────────────────────
          if [ -f "$NM/@deepseek-ai/dsh-native-command/lib/index.js" ]; then
            grep -qF 'Android 沙箱限制' "$NM/@deepseek-ai/dsh-native-command/lib/index.js" \
              && echo "· 可选：native-command 的 Android 中文提示 ✓" \
              || echo "· 可选：native-command 的 Android 中文提示未应用（只影响一句报错文案）"
          fi
          if [ -f "$NM/@deepseek-ai/dsh-host-apiproxy/lib/index.js" ]; then
            echo "· 检测到老版 dsh-host-apiproxy（0.1.1 及以下）"
          fi
          if [ -f /tmp/rt.log ] && grep -qE '\[warn\] (可执行文件不存在|缺失动态库)' /tmp/rt.log; then
            echo "::warning::jniLibs 里有可执行文件/动态库没集齐，个别 shell 命令可能不可用："
            grep -E '\[warn\] (可执行文件不存在|缺失动态库)' /tmp/rt.log || true
          fi
          if [ -f /tmp/rt.log ] && grep -qF '[warn] pnpm 安装失败' /tmp/rt.log; then
            echo "::warning::运行时里没装上 pnpm —— 应用首次启动时 WebUI 移动端插件会装配失败（不影响主体功能）"
          fi

          # ── 模块加载烟测：真正 import 一遍（能抓到"AST 没错但一加载就抛"的问题，
          #    例如 koffi stub 不匹配导致 ABI 断言失败）。attachment-local 会 import 平台
          #    相关的 sharp，容易跟补丁无关地失败，所以不放进这个列表。────────────────
          LOAD_MODULES="dsh-subprocess-local dsh-tool-fs-search dsh-sandbox-local dsh-fs-local dsh-bash-local dsh-bash-sandbox dsh-terminal-bash dsh-session-persistence-jsonl dsh-attachment-local"
          if NM="$NM" LOAD_MODULES="$LOAD_MODULES" node --input-type=module <<'LOADEOF'
          const base = process.env.NM + '/@deepseek-ai/'
          let bad = 0
          for (const m of process.env.LOAD_MODULES.split(' ')) {
            try {
              await import(base + m + '/lib/index.js')
              console.log(`· 模块加载 OK: ${m}`)
            } catch (e) {
              console.log(`::error::模块加载失败 ${m}: ${e && e.message ? e.message : e}`)
              bad = 1
            }
          }
          process.exit(bad)
          LOADEOF
          then :; else
            echo "::error::有模块一加载就抛错（多半是某个补丁没跟上新版本代码）。把上面带 ::error:: 的行发给我。"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::有 Android 补丁没打上或改坏了，这个 dsh 版本的代码变了。把上面带 ::error:: 的行发给我。"
            exit 1
          fi
          VER="$(node -e 'process.stdout.write(require(process.argv[1]).version)' "$NM/@deepseek-ai/dsh/package.json" 2>/dev/null || echo unknown)"
          echo "补丁全部就位 ✓  dsh $VER"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ 不能用 android-actions/setup-android：它内部写死的 cmdline-tools 版本
      #    15859902 已被 Google 从 dl.google.com 撤掉，下载直接 404（该 action 的
      #    open issue #536，2026-08-20 开的；@v4 同样中招）。
      #    ubuntu-latest 镜像自带 Android SDK + cmdline-tools，直接用即可。
      #
      #    注意：$GITHUB_PATH 只对【后续步骤】生效，对当前步骤无效 —— 所以这里
      #    全程用绝对路径调用 sdkmanager（上一版就是因为这个踩了 exit 127）。
      - name: Android SDK（用镜像自带的，跳过坏掉的 action）
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          CT="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$CT/sdkmanager" ]; then
            CT="$(dirname "$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null | head -1)")"
          fi
          echo "cmdline-tools=$CT"
          test -x "$CT/sdkmanager" || { echo "::error::找不到 sdkmanager（SDK=$SDK）"; exit 1; }
          "$CT/sdkmanager" --version
          "$CT/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
          yes | "$CT/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "$CT" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject native libs (node/bash/rg)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          tar -xzf runtime-out/native-libs.tar.gz -C android/app/src/main/jniLibs/arm64-v8a
          ls -lh android/app/src/main/jniLibs/arm64-v8a/ | head -25

      - name: Configure release signing
        env:
          DSHM_KEYSTORE_B64: ""
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/siliconleap-release.keystore"
            echo "SILICONLEAP_KEYSTORE_PATH=$RUNNER_TEMP/siliconleap-release.keystore" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "::notice::release 签名已启用"
          else
            # 没配 Secrets 时用【工作流里内置的固定签名密钥】。
            # 为什么不继续用 debug keystore + actions/cache：缓存不可靠 —— 只要没命中，
            # Gradle 就现场生成一把全新密钥，签出来的 APK 签名和上一版不一致，
            # 只能卸载重装（564MB 运行时和会话全丢）。内置密钥是确定性的：
            # 每次构建签名完全相同，以后永远可以直接覆盖安装。
            # （如果你以后配了 ANDROID_* Secrets，上面的分支优先，会覆盖这里。）
            echo "$DSHM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dshm-release.keystore"
            echo "SILICONLEAP_KEYSTORE_PATH=$RUNNER_TEMP/dshm-release.keystore" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEYSTORE_PASS=Dshm-Sideload-2026" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEY_ALIAS=dshm" >> "$GITHUB_ENV"
            echo "SILICONLEAP_KEY_PASS=Dshm-Sideload-2026" >> "$GITHUB_ENV"
            echo "::notice::使用内置的固定签名密钥（未配置 Secrets）"
          fi

      # 签名统一走上面「Configure release signing」的内置固定密钥，不再依赖 actions/cache。
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache -PruntimeVersion="${DSH_VERSION}"

      - name: Verify APK native libs
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "APK: $APK ($(stat -c %s "$APK") bytes)"
          unzip -l "$APK" | grep -cE "lib/arm64-v8a/(node|bash|rg|sh)$" || echo "!! 未找到 jniLibs 可执行文件"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/(libc\+\+_shared|libcrypto|libicu)" | head -5
          if unzip -l "$APK" | grep -q "assets/runtime.zip"; then echo "!! APK 仍包含完整 runtime.zip（v2.1 应在线下载）"; fi
          # 签名证书指纹：每次构建都应该是同一串。变了就说明换了密钥，
          # 那一版的包必须卸载重装 —— 所以这里显式打出来。
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          else
            echo "· 没找到 apksigner，跳过证书指纹打印"
          fi

      - name: Publish runtime assets (在线下载)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUNTIME_TAG="runtime-latest"
          if gh release view "${RUNTIME_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${RUNTIME_TAG}" runtime-out/runtime.zip runtime-out/metadata.json --clobber --repo "${REPO}"
          else
            gh release create "${RUNTIME_TAG}" runtime-out/runtime.zip runtime-out/metadata.json \
              --title "SiliconLeap Runtime" \
              --notes "应用在线下载的运行时（自动更新，覆盖上传）" \
              --repo "${REPO}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v2.1.1"
          fi
          REPO="${GITHUB_REPOSITORY}"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::未找到 APK"
            exit 1
          fi
          printf '%s\n' \
            "SiliconLeap ${TAG}（硅基跃迁 · Preview）" "" \
            "## 安装说明" \
            "- 支持 Android 13.0+（arm64）" \
            "- 内置 Termux 运行时与 DeepSeek Harness，首次启动自动解压，即装即用" \
            "- 配置模型：进入应用后 Settings → Models 填入 DeepSeek API Key" "" \
            "## 版本" \
            "- 基础版本 v2.N.E：当前 N=1、E=1" > NOTES.md
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，上传 APK"
            gh release upload "${TAG}" "${APK}" --clobber --repo "${REPO}"
          else
            echo "创建 Release ${TAG}"
            gh release create "${TAG}" "${APK}" \
              --title "SiliconLeap ${TAG}" \
              --notes-file NOTES.md \
              --repo "${REPO}"
          fi

