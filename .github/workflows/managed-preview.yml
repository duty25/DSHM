name: Managed Linux 0.1.7 Preview
on:
  push:
    branches: [refactor/linux017-managed-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: node --test managed-runtime/test/*.test.cjs
      - run: python3 -m unittest discover -s managed-runtime/test -p 'test_*.py'
      - name: Check builder syntax
        run: |
          bash -n runtime-builder/build_runtime.sh
          bash -n runtime-builder/build_linux_runtime.sh
          node --check managed-runtime/tools/apply-linux-compat.cjs
  preview:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip dpkg dpkg-dev binutils
      - name: Build native bootstrap without a DSH SDK
        env:
          BOOTSTRAP_ONLY: '1'
          BUILD_PTY: '0'
          TERMUX_MIRROR: https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main
        run: |
          WORK="$RUNNER_TEMP/native-support" OUT="$GITHUB_WORKSPACE/runtime-build/native" bash runtime-builder/build_runtime.sh
          mkdir -p android/app/src/managedPreview/assets android/app/src/main/jniLibs/arm64-v8a
          cp runtime-build/native/runtime.zip android/app/src/managedPreview/assets/managed-native-support.zip
          tar -xzf runtime-build/native/native-libs.tar.gz -C android/app/src/main/jniLibs/arm64-v8a
          test -f android/app/src/main/jniLibs/arm64-v8a/libnode.so
          test -f android/app/src/main/jniLibs/arm64-v8a/libproot.so
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile('runtime-build/native/runtime.zip') as z:
              assert not any('node_modules/@deepseek-ai/dsh' in p for p in z.namelist()), 'legacy SDK leaked into native bootstrap'
          PYTHON
      - name: Build pinned Linux runtime (no personal plugins or credentials)
        run: |
          WORK="$RUNNER_TEMP/linux-runtime" OUT="$GITHUB_WORKSPACE/runtime-build/linux" bash runtime-builder/build_linux_runtime.sh
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CT="$SDK/cmdline-tools/latest/bin"
          test -x "$CT/sdkmanager"
          yes | "$CT/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CT/sdkmanager" --install 'platforms;android-37.0' 'build-tools;37.0.0'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile independent preview APK
        working-directory: android
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/managed-preview-gradle.log"
          if bash ./gradlew assembleManagedPreview --no-daemon --no-configuration-cache --console=plain -PruntimeRepository="${GITHUB_REPOSITORY}" >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            python3 - "$log" <<'PYTHON'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          failure = text[text.rfind("FAILURE:"):] if "FAILURE:" in text else text
          diagnostics = [line for line in text.splitlines() if line.lstrip().startswith(("e:", "error:"))]
          summary = (failure[:1500] + "\n" + "\n".join(diagnostics[-8:])).strip()[:2800]
          for old, new in (("%", "%25"), ("\r", "%0D"), ("\n", "%0A")):
              summary = summary.replace(old, new)
          print("::error title=Managed preview Gradle failure::" + summary)
          PYTHON
            exit "$status"
          fi
      - name: Write preview limitations
        run: |
          cat > runtime-build/PREVIEW-README.txt <<'EOF'
          工程预览：独立包名 com.siliconleap.app.linuxpreview，端口39017。
          不覆盖正式App，不发布Release，不自动导入正式App账号、会话或私有插件包。
          Linux运行时包锁定Node24.22.0 / DSH0.1.7-rc.1；当前36插件的适配基线另有清单，私有代码不上传。
          此APK使用CI调试签名；不同构建间的覆盖安装签名不作保证，只能卸载预览版时先备份预览数据。
          源码、单元测试和编译成功均不代表Android实机启动/恢复/全部业务验收完成。
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dshm-linux017-managed-preview
          path: |
            android/app/build/outputs/apk/managedPreview/*.apk
            runtime-build/linux/*.zip
            runtime-build/linux/*.sha256
            runtime-build/PREVIEW-README.txt
          if-no-files-found: error
          retention-days: 14
